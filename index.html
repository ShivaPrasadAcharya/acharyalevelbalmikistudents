<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d4e">
  <meta name="description" content="वाल्मीकि आचार्य तहका विद्यार्थी सूची — खोज, फिल्टर र क्रमबद्ध तालिकाहरू।">
  <title>आचार्य तह · वाल्मीकि विद्यार्थी सूची</title>
  <style>
    :root{color-scheme:light;--ink:#172a43;--muted:#607086;--blue:#174f92;--navy:#142d4e;--line:#dce3ec;--surface:#fff;--bg:#f4f7fb;--sticky-height:155px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Devanagari","Kalimati","Nirmala UI","Mangal",system-ui,sans-serif}
    button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
    button,select{cursor:pointer}button{color:inherit}button:disabled{cursor:default;opacity:.42}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82b6f2;outline-offset:3px}
    .wrap{max-width:1420px;margin:auto;padding:0 32px}.topline{height:5px;background:var(--navy)}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:26px;padding-bottom:24px}
    .brand{display:flex;align-items:center;gap:14px}.monogram{width:48px;height:48px;display:grid;place-items:center;background:var(--navy);color:white;border-radius:10px;font-size:25px}
    .eyebrow{font-size:14px;color:var(--muted);line-height:1.3;margin-bottom:3px}h1{font-size:25px;line-height:1.45;margin:0;font-weight:700}h2{font-size:20px;line-height:1.5;margin:0}
    .header-links{display:flex;align-items:center;gap:20px;font-size:15px}.add-link{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:white;font-weight:600}
    .toolbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);border-block:1px solid var(--line);box-shadow:0 4px 12px #142d4e08}.toolbar-inner{padding-top:15px;padding-bottom:15px}
    .control-line{display:flex;align-items:center;gap:13px}.table-picker{display:flex;align-items:center;gap:10px;flex:0 1 360px;min-width:220px}.table-picker label{font-size:14px;font-weight:600;white-space:nowrap}
    select{height:45px;border:1px solid #cbd5e2;border-radius:7px;background:white;color:var(--ink);padding:5px 32px 5px 12px;max-width:100%;min-width:0}.table-picker select{width:100%}
    .search-box{display:flex;align-items:center;gap:9px;flex:1;min-width:170px;border:1px solid #b5c6db;border-radius:7px;padding:0 11px;background:#fff}.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px #174f9210}.search-icon{flex-shrink:0;color:var(--muted)}
    .search-box input{width:100%;height:44px;padding:6px 0;border:0;background:transparent;outline:none;min-width:60px}.search-box input::-webkit-search-cancel-button{appearance:none}.clear{border:0;background:transparent;padding:4px 6px;font-size:22px;color:var(--muted);line-height:1}
    .match-nav{display:flex;align-items:center;gap:3px;white-space:nowrap}.match-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}.nav-btn{border:0;border-radius:5px;width:31px;height:32px;background:#edf2f8;display:grid;place-items:center;font-size:20px}
    .options-line{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px}.options-btn{background:transparent;border:0;color:var(--blue);padding:3px 0;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}.options-btn svg{transition:transform .15s}.options-btn[aria-expanded=true] svg{transform:rotate(180deg)}
    .help-text{font-size:13px;color:var(--muted)}.advanced{border-top:1px solid var(--line);padding-top:17px;margin-top:12px;max-height:calc(100dvh - 185px);overflow-y:auto}.advanced[hidden]{display:none}.options-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}.field{display:flex;flex-direction:column;gap:5px}.field>span{font-size:14px;font-weight:600}.field select{width:100%}.filter-pair,.sort-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .check-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:15px}.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.check input{width:17px;height:17px;accent-color:var(--blue)}.reset{margin-left:auto;border:1px solid var(--line);background:white;border-radius:6px;padding:5px 12px;font-size:14px}
    main{padding-top:25px;padding-bottom:70px}.summary{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.summary strong{font-size:16px}.summary span{font-size:14px;color:var(--muted)}
    .table-card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:25px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}.table-description{font-size:14px;color:var(--muted);margin:3px 0 0}.row-count{border:1px solid var(--line);color:var(--muted);border-radius:20px;font-size:14px;padding:3px 12px;white-space:nowrap}.table-scroll{overflow:auto}
    table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:13px 18px;border-bottom:1px solid #e6ebf2;vertical-align:top}th{background:#edf3fa;color:#385572;font-weight:600;font-size:14px;white-space:nowrap}td{font-size:16px;line-height:1.6}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fafbfd}tbody tr:hover{background:#f0f5fb}
    .sn{color:var(--muted);font-size:14px;min-width:65px}.roll{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}.name{font-weight:600;min-width:225px}.note{color:#8a6130;font-size:14px;min-width:195px;max-width:280px}.cell-link{word-break:break-word}td:has(.match){scroll-margin-top:calc(var(--sticky-height) + 18px)}
    .sort-heading{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:inherit;font-weight:inherit;font-size:inherit;text-align:left}.sort-symbol{color:#7991ab;font-size:13px}.match{scroll-margin-top:calc(var(--sticky-height) + 24px)}mark.match{background:#fff0a5;color:inherit;padding:0;border-radius:2px}mark.match.active{background:#ffc96d}.match:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:16px}.alert{background:#fff4e2;color:#714e1c;border:1px solid #eed5aa;border-radius:7px;padding:13px 17px;margin-bottom:17px;font-size:14px}.alert[hidden]{display:none}.footer{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    .go-top{position:fixed;right:25px;bottom:25px;z-index:30;width:47px;height:47px;border:0;border-radius:50%;background:var(--navy);color:white;box-shadow:0 5px 20px #142d4e30;display:grid;place-items:center}.go-top[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1000px){.wrap{padding-left:22px;padding-right:22px}.control-line{align-items:stretch;flex-wrap:wrap}.table-picker{flex:1;min-width:100%}.search-box{flex-basis:100%}.options-grid{grid-template-columns:1fr 1fr}.options-grid .field:last-child{grid-column:1/-1}.help-text{display:none}}
    @media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.masthead{padding-top:18px;padding-bottom:18px;align-items:flex-start;gap:12px}.brand{gap:9px}.monogram{width:37px;height:41px;font-size:22px}.eyebrow{font-size:13px}h1{font-size:20px}.header-links{gap:0}.repo-link{display:none}.add-link{font-size:13px;padding:7px 9px}.table-picker label{font-size:14px}.toolbar-inner{padding-top:11px;padding-bottom:11px}.search-box{gap:6px;padding:0 8px}.match-count{font-size:13px;min-width:45px}.nav-btn{width:28px}.options-grid{grid-template-columns:1fr}.options-grid .field:last-child{grid-column:auto}.check-row{gap:9px 16px}.reset{margin-left:0}.table-head{padding:14px 16px;align-items:flex-start}h2{font-size:18px}.table-description{font-size:13px}th,td{padding:11px 13px}.summary{align-items:flex-start}.summary span{font-size:13px;text-align:right}.go-top{right:15px;bottom:16px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="topline"></div>
  <header class="wrap masthead">
    <div class="brand"><div class="monogram" aria-hidden="true">आ</div><div><div class="eyebrow">आचार्य तह</div><h1>वाल्मीकि विद्यार्थी सूची</h1></div></div>
    <nav class="header-links" aria-label="फाइल व्यवस्थापन">
      <a class="repo-link" href="https://github.com/ShivaPrasadAcharya/acharyalevelbalmikistudents" target="_blank" rel="noopener">Repository</a>
      <a class="add-link" href="https://github.com/ShivaPrasadAcharya/acharyalevelbalmikistudents/upload/main/data" target="_blank" rel="noopener"><span aria-hidden="true">＋</span> JSON थप्नुहोस्</a>
    </nav>
  </header>
  <section class="toolbar" aria-label="खोज र तालिका छनोट">
    <div class="wrap toolbar-inner">
      <div class="control-line">
        <div class="table-picker"><label for="table-select">तालिका</label><select id="table-select"><option value="all">सबै तालिका (All)</option></select></div>
        <div class="search-box">
          <svg class="search-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <label class="sr-only" for="search">नाम, रोल नम्बर वा अन्य विवरण खोज्नुहोस्</label><input id="search" type="search" placeholder="नाम, रोल नम्बर वा विवरण खोज्नुहोस्…" autocomplete="off" spellcheck="false">
          <button class="clear" id="clear" type="button" aria-label="खोज मेटाउनुहोस्" hidden>×</button>
          <div class="match-nav"><output class="match-count" id="match-count" aria-live="polite">0 / 0</output><button class="nav-btn" id="previous" type="button" title="अघिल्लो मिलान (Shift + Enter)" aria-label="अघिल्लो मिलान" disabled>‹</button><button class="nav-btn" id="next" type="button" title="अर्को मिलान (Enter)" aria-label="अर्को मिलान" disabled>›</button></div>
        </div>
      </div>
      <div class="options-line"><button class="options-btn" id="advanced-toggle" type="button" aria-expanded="false" aria-controls="advanced">विस्तृत खोज, फिल्टर र क्रमबद्धता <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg></button><span class="help-text">मिलानमा जान Enter · अघिल्लोमा जान Shift + Enter</span></div>
      <div class="advanced" id="advanced" hidden>
        <div class="options-grid">
          <label class="field"><span>खोज्ने स्तम्भ</span><select id="search-column"><option value="all">सबै स्तम्भ</option></select></label>
          <div class="field"><span>फिल्टर</span><div class="filter-pair"><select id="filter-column" aria-label="फिल्टरको स्तम्भ"><option value="">फिल्टर छैन</option></select><select id="filter-value" aria-label="फिल्टरको मान" disabled><option value="">सबै मान</option></select></div></div>
          <div class="field"><span>क्रमबद्धता</span><div class="sort-pair"><select id="sort-column" aria-label="क्रमबद्ध गर्ने स्तम्भ"><option value="">मूल क्रम</option></select><select id="sort-direction" aria-label="क्रमबद्ध गर्ने दिशा"><option value="asc">बढ्दो · A–Z</option><option value="desc">घट्दो · Z–A</option></select></div></div>
        </div>
        <div class="check-row">
          <label class="check" title="मात्रा, श/ष/स, ण/न र खाली ठाउँको भिन्नता मिलाएर खोज्नुहोस्"><input type="checkbox" id="normalize" checked> नेपाली Normalizer</label>
          <label class="check"><input type="checkbox" id="highlight"> Highlight</label>
          <label class="check"><input type="checkbox" id="filter-matches" checked> मिल्ने पङ्क्ति मात्र</label>
          <label class="check"><input type="checkbox" id="exact"> पूरै विवरण मिल्ने</label>
          <button class="reset" type="button" id="reset">Reset</button>
        </div>
      </div>
    </div>
  </section>
  <main class="wrap">
    <div class="alert" id="alert" role="status" hidden></div>
    <div class="summary"><strong id="summary" aria-live="polite">सूची पढिँदै छ…</strong><span id="result-note"></span></div>
    <div id="tables" aria-busy="true"><div class="table-card empty">विद्यार्थी विवरण पढिँदै छ…</div></div>
    <footer class="footer"><span>थप सूचीका लागि “JSON थप्नुहोस्” बाट फाइल राख्नुहोस्।</span><a href="https://github.com/ShivaPrasadAcharya/acharyalevelbalmikistudents#नयाँ-तालिका-थप्ने" target="_blank" rel="noopener">JSON ढाँचा र सहायता</a></footer>
  </main>
  <button class="go-top" id="go-top" type="button" aria-label="माथि जानुहोस्" title="माथि जानुहोस्" hidden><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7"/></svg></button>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const state = { tables: [], matches: [], active: -1, queryTimer: null };
    const normalMap = {'ी':'ि','ू':'ु','ृ':'ि','ऋ':'रि','ॠ':'रि','श':'स','ष':'स','ण':'न'};
    const collator = new Intl.Collator('ne', {numeric:true, sensitivity:'base'});
    const labels = {roll:'रोल नम्बर',name:'विद्यार्थीको नाम',side:'तर्फ',row:'पङ्क्ति',seat:'स्थान',note:'कैफियत'};
    function valueText(value) { return value == null ? '' : typeof value === 'object' ? JSON.stringify(value) : String(value); }
    function el(tag, className, text) { const node=document.createElement(tag); if(className)node.className=className; if(text!==undefined)node.textContent=text; return node; }
    function normalized(text, useNormalizer) {
      let result='', starts=[], ends=[], offset=0;
      for(const char of text) {
        const start=offset; offset+=char.length;
        if(/[\u200B-\u200D\uFEFF]/u.test(char) || (useNormalizer && /\s/u.test(char)))continue;
        let mapped=(useNormalizer ? normalMap[char] || char : char).toLocaleLowerCase();
        mapped=mapped.replace(/[०-९]/g,d=>String(d.charCodeAt(0)-0x0966));
        for(let i=0;i<mapped.length;i++){result+=mapped[i];starts.push(start);ends.push(offset);}
      }
      return {text:result,starts,ends};
    }
    function ranges(text) {
      const useNormalizer=$('normalize').checked;
      const needle=normalized($('search').value.trim(),useNormalizer).text;
      if(!needle)return [];
      const haystack=normalized(text,useNormalizer);
      if($('exact').checked && haystack.text!==needle)return [];
      let result=[], cursor=0, position;
      while((position=haystack.text.indexOf(needle,cursor))!==-1){
        const range=[haystack.starts[position],haystack.ends[position+needle.length-1]];
        const previous=result[result.length-1];
        if(previous && range[0]<previous[1]) previous[1]=Math.max(previous[1],range[1]);
        else result.push(range);
        cursor=position+needle.length;
      }
      return result;
    }
    function parseTable(data, file, title) {
      const rows=Array.isArray(data)?data:data.rows??data.students??data.data;
      if(!Array.isArray(rows)||rows.some(row=>!row || typeof row!=='object'||Array.isArray(row)))throw new Error('पङ्क्तिहरूको JSON ढाँचा मिलेन');
      const rawColumns=Array.isArray(data)?null:data.columns;
      const columns=rawColumns ? rawColumns.map(c=>typeof c==='string'?{key:c,label:labels[c]||c}:{key:c.key,label:c.label||labels[c.key]||c.key}) : [...new Set(rows.flatMap(row=>Object.keys(row)))].map(key=>({key,label:labels[key]||key}));
      if(!columns.length || columns.some(c=>typeof c.key!=='string'||!c.key) || new Set(columns.map(c=>c.key)).size!==columns.length)throw new Error('स्तम्भहरूको JSON ढाँचा मिलेन');
      return {file,title:valueText(data.title||title||file),description:valueText(data.description),columns,rows:rows.map((row,index)=>({value:row,index}))};
    }
    function selectedTables(){const selection=$('table-select').value;return state.tables.filter(t=>selection==='all'||selection===t.file);}
    function fillSelect(select, items, firstLabel, firstValue='') {
      const previous=select.value;select.replaceChildren(new Option(firstLabel,firstValue));
      for(const [key,label] of items)select.add(new Option(label,key));
      if([...select.options].some(o=>o.value===previous))select.value=previous;
    }
    function refreshFields() {
      const columns=new Map();for(const table of selectedTables())for(const c of table.columns)columns.set(c.key,c.label);
      fillSelect($('search-column'),columns,'सबै स्तम्भ','all');
      fillSelect($('filter-column'),columns,'फिल्टर छैन');
      fillSelect($('sort-column'),columns,'मूल क्रम');
      refreshFilterValues();
    }
    function refreshFilterValues() {
      const column=$('filter-column').value, values=new Set();
      if(column)for(const table of selectedTables())for(const row of table.rows)values.add(valueText(row.value[column]));
      fillSelect($('filter-value'),[...values].sort(collator.compare).map(v=>['v:'+v,v||'(खाली)']),'सबै मान');
      $('filter-value').disabled=!column;
    }
    function drawCell(text, matches, className) {
      const td=el('td',className);let offset=0;
      for(const [start,end] of matches){
        td.append(document.createTextNode(text.slice(offset,start)));
        const node=el($('highlight').checked?'mark':'span','match',text.slice(start,end));node.tabIndex=-1;
        td.append(node);state.matches.push(node);offset=end;
      }
      td.append(document.createTextNode(text.slice(offset)));
      if(!matches.length && /^https?:\/\/[^\s]+$/i.test(text)){
        try{const url=new URL(text);const link=el('a','cell-link',text);link.href=url.href;link.target='_blank';link.rel='noopener';td.replaceChildren(link);}catch{}
      }
      return td;
    }
    function updateMatchCount(){
      $('match-count').textContent=(state.active>=0?state.active+1:0)+' / '+state.matches.length;
      $('previous').disabled=$('next').disabled=!state.matches.length;
      $('clear').hidden=!$('search').value;
    }
    function render() {
      state.matches=[];state.active=-1;const fragment=document.createDocumentFragment();let shown=0,total=0;
      const tables=selectedTables(), query=normalized($('search').value.trim(),$('normalize').checked).text;
      const sortKey=$('sort-column').value, filterKey=$('filter-column').value, filterValue=$('filter-value').value, scope=$('search-column').value;
      for(const table of tables){
        total+=table.rows.length;
        let rows=table.rows.filter(row=>!filterKey||!filterValue||valueText(row.value[filterKey])===filterValue.slice(2));
        const annotated=rows.map(row=>({row,cells:table.columns.map(c=>{const text=valueText(row.value[c.key]);return {column:c,text,matches:scope==='all'||scope===c.key?ranges(text):[]};})}));
        rows=annotated.filter(record=>!query||!$('filter-matches').checked||record.cells.some(c=>c.matches.length));
        if(sortKey)rows.sort((a,b)=>collator.compare(valueText(a.row.value[sortKey]),valueText(b.row.value[sortKey]))*($('sort-direction').value==='desc'?-1:1)||a.row.index-b.row.index);
        shown+=rows.length;
        const card=el('section','table-card'), heading=el('div','table-head'), titleBox=el('div');
        titleBox.append(el('h2','',table.title));if(table.description)titleBox.append(el('p','table-description',table.description));
        heading.append(titleBox,el('span','row-count',rows.length+' / '+table.rows.length));card.append(heading);
        if(!rows.length){card.append(el('div','empty',table.rows.length?'मिल्ने विद्यार्थी विवरण भेटिएन।':'यो तालिकामा विद्यार्थी विवरण थपिएको छैन।'));fragment.append(card);continue;}
        const scroll=el('div','table-scroll');scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label',table.title+' — तालिका');
        const grid=el('table'), caption=el('caption','sr-only',table.title), thead=el('thead'), header=el('tr');header.append(el('th','sn','क्र.सं.'));
        for(const c of table.columns){
          const th=el('th');th.scope='col';const button=el('button','sort-heading');button.type='button';button.append(document.createTextNode(c.label),el('span','sort-symbol',sortKey===c.key?($('sort-direction').value==='asc'?'▲':'▼'):'↕'));
          button.title=c.label+' अनुसार क्रमबद्ध गर्नुहोस्';
          if(sortKey===c.key)th.setAttribute('aria-sort',$('sort-direction').value==='asc'?'ascending':'descending');
          button.addEventListener('click',()=>{if($('sort-column').value===c.key)$('sort-direction').value=$('sort-direction').value==='asc'?'desc':'asc';else{$('sort-column').value=c.key;$('sort-direction').value='asc';}render();});
          th.append(button);header.append(th);
        }
        thead.append(header);const tbody=el('tbody');
        for(const record of rows){const tr=el('tr');tr.append(el('td','sn',record.row.index+1));for(const cell of record.cells)tr.append(drawCell(cell.text,cell.matches,['roll','name','note'].includes(cell.column.key)?cell.column.key:''));tbody.append(tr);}
        grid.append(caption,thead,tbody);scroll.append(grid);card.append(scroll);fragment.append(card);
      }
      $('tables').replaceChildren(fragment);$('tables').setAttribute('aria-busy','false');
      $('summary').textContent=tables.length+' तालिका · '+shown+' विद्यार्थी';
      $('result-note').textContent=shown===total?'जम्मा '+total+' विवरण':total+' मध्ये '+shown+' विवरण देखाइएको';
      if(state.matches.length){state.active=0;state.matches[0].classList.add('active');}updateMatchCount();
    }
    function navigate(direction) {
      if(!state.matches.length)return;
      if(state.active>=0)state.matches[state.active].classList.remove('active');
      state.active=(state.active+direction+state.matches.length)%state.matches.length;
      const node=state.matches[state.active];node.classList.add('active');
      node.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center',inline:'center'});
      updateMatchCount();
    }
    function reset(){
      clearTimeout(state.queryTimer);$('search').value='';$('search-column').value='all';$('filter-column').value='';$('sort-column').value='';$('sort-direction').value='asc';$('normalize').checked=true;$('highlight').checked=false;$('filter-matches').checked=true;$('exact').checked=false;refreshFilterValues();render();
    }
    $('search').addEventListener('input',()=>{clearTimeout(state.queryTimer);state.queryTimer=setTimeout(()=>{state.queryTimer=null;render();},100);});
    $('search').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();clearTimeout(state.queryTimer);if(state.queryTimer){state.queryTimer=null;render();}navigate(event.shiftKey?-1:1);}if(event.key==='Escape'){clearTimeout(state.queryTimer);$('search').value='';render();}});
    $('clear').addEventListener('click',()=>{clearTimeout(state.queryTimer);$('search').value='';render();$('search').focus();});
    $('table-select').addEventListener('change',()=>{refreshFields();render();});
    $('filter-column').addEventListener('change',()=>{$('filter-value').value='';refreshFilterValues();render();});
    for(const id of ['search-column','filter-value','sort-column','sort-direction','normalize','highlight','filter-matches','exact'])$(id).addEventListener('change',render);
    $('previous').addEventListener('click',()=>navigate(-1));$('next').addEventListener('click',()=>navigate(1));$('reset').addEventListener('click',reset);
    $('advanced-toggle').addEventListener('click',()=>{const expanded=$('advanced-toggle').getAttribute('aria-expanded')==='true';$('advanced-toggle').setAttribute('aria-expanded',String(!expanded));$('advanced').hidden=expanded;});
    new ResizeObserver(entries=>document.documentElement.style.setProperty('--sticky-height',Math.ceil(entries[0].target.getBoundingClientRect().height)+'px')).observe(document.querySelector('.toolbar'));
    window.addEventListener('scroll',()=>{$('go-top').hidden=window.scrollY<240;},{passive:true});
    $('go-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
    async function load() {
      try{
        const response=await fetch('files.json',{cache:'no-store'});if(!response.ok)throw new Error('तालिकाको सूची पढ्न सकिएन।');
        const manifest=await response.json();if(!Array.isArray(manifest.files)||!manifest.files.length)throw new Error('कुनै JSON तालिका थपिएको छैन।');
        const results=await Promise.allSettled(manifest.files.map(async entry=>{
          const file=typeof entry==='string'?entry:entry.file;const url=new URL(file,location.href);
          if(url.origin!==location.origin || !file.startsWith('data/') || file.includes('..'))throw new Error('अमान्य फाइल पथ');
          const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(file+' पढ्न सकिएन।');
          return parseTable(await res.json(),file,entry.title);
        }));
        state.tables=results.filter(r=>r.status==='fulfilled').map(r=>r.value);
        const errors=results.filter(r=>r.status==='rejected').map(r=>r.reason.message);
        if(errors.length){$('alert').hidden=false;$('alert').textContent=errors.join(' · ');}
        if(!state.tables.length)throw new Error('कुनै पनि तालिका पढ्न सकिएन।');
        for(const table of state.tables)$('table-select').add(new Option(table.title,table.file));
        refreshFields();render();
      }catch(error){$('tables').setAttribute('aria-busy','false');$('summary').textContent='सूची पढ्न सकिएन';$('tables').replaceChildren(el('div','table-card empty',error.message+' पृष्ठ फेरि खोल्नुहोस् वा JSON फाइल जाँच्नुहोस्।'));}
    }
    load();
  </script>
</body>
</html>
